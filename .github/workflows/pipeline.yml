name: CI/CD Pipeline — Audience Comment Miner

on:
  push:
    branches: ["**"]         # Lint + test on ALL pushes
  pull_request:
    branches: [main]
  workflow_dispatch:          # Manual trigger anytime

jobs:
  # ════════════════════════════════════════════════════
  # JOB 1: LINT + TEST (runs on every push)
  # ════════════════════════════════════════════════════
  test-and-lint:
    name: 🧪 Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov

      - name: 🔍 Run linting (flake8)
        run: |
          flake8 src/ tests/ \
            --max-line-length=100 \
            --exclude=__pycache__ \
            --statistics
        continue-on-error: false

      - name: ✅ Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --tb=short
        env:
          # Secrets injected from GitHub Secrets
          # Never hardcoded here!
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/
        if: always()

  # ════════════════════════════════════════════════════
  # JOB 2: DEPLOY TO STAGING (only on merge to main)
  # ════════════════════════════════════════════════════
  deploy-staging:
    name: 🚀 Deploy to Staging
    needs: test-and-lint          # Only runs if tests pass!
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: staging
      url: https://your-app.onrender.com

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Render (Staging)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Deploying to staging..."
          curl -s -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'

      - name: ⏳ Wait for deployment
        run: sleep 30

      - name: 🔍 Health check staging
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://your-app.onrender.com/health)
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed! Status: $STATUS"
            exit 1
          fi
          echo "✅ Staging deployment healthy!"
        continue-on-error: true

      - name: 📢 Notify success
        run: |
          echo "✅ Successfully deployed to staging!"
          echo "URL: https://your-app.onrender.com"
